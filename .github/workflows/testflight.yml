# Compila la app de Alma en una Mac de GitHub y la sube a TestFlight.
#   · En cada PR: compila sin firmar (revisa que el código compile antes del Merge).
#   · Al dar Merge a main (o a mano): firma con la llave de App Store Connect y sube la versión a TestFlight.
# Secretos (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID     Key ID de la llave de App Store Connect
#   ASC_ISSUER_ID  Issuer ID
#   ASC_KEY_P8     contenido completo del archivo AuthKey_XXXX.p8 (con BEGIN/END)

name: TestFlight

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SUBIR: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode más reciente de la Mac
        run: |
          X="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$X"
          xcodebuild -version

      # Modo calle: el modelo del detector de «Alma» (sherpa-onnx KWS zipformer zh-en 3M, Apache-2.0). Se baja de la
      # versión publicada por sherpa-onnx y solo se usa si cada archivo coincide con su suma de comprobación.
      - name: Modelo del detector de «Alma» (Modo calle)
        run: |
          set -euo pipefail
          M=sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20
          curl -fsSL --retry 3 -o /tmp/kws.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/$M.tar.bz2"
          tar xjf /tmp/kws.tar.bz2 -C /tmp
          mkdir -p Modelos/Calle
          while read -r SUMA NOMBRE; do
            cp "/tmp/$M/$NOMBRE" "Modelos/Calle/$NOMBRE"
            echo "$SUMA  Modelos/Calle/$NOMBRE" | shasum -a 256 -c - || { shasum -a 256 "/tmp/$M/$NOMBRE"; exit 1; }
          done <<'SUMAS'
          408bbd740838c42d5bf6d1c5b80b3c88b616c7860b92d980328b5b068c76ae48 encoder-epoch-13-avg-2-chunk-16-left-64.int8.onnx
          63a22dd60f40fff082ac3e09afa507f6787da36df76ded2fbe145fa233e22c21 decoder-epoch-13-avg-2-chunk-16-left-64.onnx
          190d4067b4cc20b72a42a1916e69d92052000fb7051a427ebb1bc72a69207dc1 joiner-epoch-13-avg-2-chunk-16-left-64.int8.onnx
          2d3f32311f9b692b964da3c90e830258d3e78e013cb0c992dbfb15cd5a1a71b0 tokens.txt
          SUMAS
          ls -l Modelos/Calle

      - name: Generar el proyecto (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilar sin firmar (PR)
        if: env.SUBIR != 'true'
        run: |
          set -o pipefail
          # Si falla, se muestran primero los errores del compilador (con tail solo se veía el final del registro).
          xcodebuild -project Alma.xcodeproj -scheme Alma -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 \
            || { grep -E "error:" -A3 build.log | head -80; tail -20 build.log; exit 1; }
          tail -20 build.log

      - name: Llave de App Store Connect
        if: env.SUBIR == 'true'
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          KID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -z "$P8" ] || [ -z "$KID" ]; then echo "::error::Faltan los secretos ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8."; exit 1; fi
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/asc/AuthKey_$KID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_$KID.p8" >> "$GITHUB_ENV"

      - name: Archivar y subir a TestFlight
        if: env.SUBIR == 'true'
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $ASC_KEY_PATH -authenticationKeyID $KID -authenticationKeyIssuerID $ISS"
          # Se archiva sin firmar (la firma de desarrollo pide un iPhone registrado) y la exportación firma para
          # distribución con el certificado que Apple guarda en la nube.
          xcodebuild -project Alma.xcodeproj -scheme Alma -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Alma.xcarchive archive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGNING_ALLOWED=NO | tail -40
          # El archivo sin firmar no lleva los permisos (Apple Salud): se le ponen con una firma provisional y la
          # exportación los conserva al firmar para distribución (y los activa en el App ID con -allowProvisioningUpdates).
          codesign --force --sign - --entitlements Alma/Alma.entitlements build/Alma.xcarchive/Products/Applications/Alma.app
          xcodebuild -exportArchive -archivePath build/Alma.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export $AUTH | tail -60
          echo "Versión 1.0 (${{ github.run_number }}) enviada a TestFlight. Apple la procesa en 5–15 min." >> "$GITHUB_STEP_SUMMARY"

      - name: Borrar la llave
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
