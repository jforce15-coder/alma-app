# Compila la app de Alma en una Mac de GitHub y la sube a TestFlight.
#   · En cada PR: compila sin firmar (revisa que el código compile antes del Merge).
#   · Al dar Merge a main (o a mano): firma con la llave de App Store Connect y sube la versión a TestFlight.
# Secretos (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID     Key ID de la llave de App Store Connect
#   ASC_ISSUER_ID  Issuer ID
#   ASC_KEY_P8     contenido completo del archivo AuthKey_XXXX.p8 (con BEGIN/END)

name: TestFlight

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SUBIR: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode más reciente de la Mac
        run: |
          X="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$X"
          xcodebuild -version

      # Modo calle: el modelo del detector de «Alma» (sherpa-onnx KWS zipformer zh-en 3M, Apache-2.0). Se baja de la
      # versión publicada por sherpa-onnx y solo se usa si cada archivo coincide con su suma de comprobación.
      - name: Modelo del detector de «Alma» (Modo calle)
        run: |
          set -euo pipefail
          M=sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20
          curl -fsSL --retry 3 -o /tmp/kws.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/$M.tar.bz2"
          tar xjf /tmp/kws.tar.bz2 -C /tmp
          mkdir -p Modelos/Calle
          while read -r SUMA NOMBRE; do
            cp "/tmp/$M/$NOMBRE" "Modelos/Calle/$NOMBRE"
            echo "$SUMA  Modelos/Calle/$NOMBRE" | shasum -a 256 -c - || { shasum -a 256 "/tmp/$M/$NOMBRE"; exit 1; }
          done <<'SUMAS'
          408bbd740838c42d5bf6d1c5b80b3c88b616c7860b92d980328b5b068c76ae48 encoder-epoch-13-avg-2-chunk-16-left-64.int8.onnx
          63a22dd60f40fff082ac3e09afa507f6787da36df76ded2fbe145fa233e22c21 decoder-epoch-13-avg-2-chunk-16-left-64.onnx
          190d4067b4cc20b72a42a1916e69d92052000fb7051a427ebb1bc72a69207dc1 joiner-epoch-13-avg-2-chunk-16-left-64.int8.onnx
          2d3f32311f9b692b964da3c90e830258d3e78e013cb0c992dbfb15cd5a1a71b0 tokens.txt
          SUMAS
          ls -l Modelos/Calle

      # La lógica pura del oído del Modo calle (ganancia, voces cortas, respaldo, pista): se prueba sola en segundos.
      - name: Probar el oído del Modo calle
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/OidoCalle.swift Pruebas/OidoCalle/main.swift -o /tmp/oido-calle
          /tmp/oido-calle

      # La limpieza de la voz en vivo (Juan, 17-nov-2026): graves fuera, ruido de fondo abajo, volumen parejo sin saturar y el
      # eco de Alma no se aprende. Lógica pura con señales de prueba.
      - name: Probar la limpieza de la voz
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/LimpiezaVoz.swift Pruebas/LimpiezaVoz/main.swift -o /tmp/limpieza-voz
          /tmp/limpieza-voz

      # La Guía de camino (Hub #661): cada paso justo a tiempo, «llegaste» una vez y recalcular fuera del camino. Lógica pura.
      - name: Probar la Guía de camino
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/GuiaCaminoReglas.swift Pruebas/GuiaCamino/main.swift -o /tmp/guia-camino
          /tmp/guia-camino

      # El Navegador de Alma en sus modos (Hub #773): la pausa de privacidad (contraseña, código, tarjeta,
      # captcha), la tarjeta de datos para copiar (nunca nada privado) y el ritmo humano con tope por sitio. Lógica pura.
      - name: Probar el Navegador de Alma
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/NavegadorReglas.swift Pruebas/Navegador/main.swift -o /tmp/navegador
          /tmp/navegador

      # La tarjeta de la llamada (#446 T2) y el tablero bento por estado (Hub #508): una a la vez, se queda hasta que llega
      # otra o se cuelga, también en conferencia con la pantalla encendida, y nada con el teléfono bloqueado. Lógica pura.
      - name: Probar la tarjeta de la llamada
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/TarjetaLlamada.swift Pruebas/TarjetaLlamada/main.swift -o /tmp/tarjeta-llamada
          /tmp/tarjeta-llamada

      # GIF de la broma (Hub, 16-nov-2026): solo con Juan, con la pantalla a la vista y con Alma; uno cada 60 s y 4 por
      # llamada; la idea se limpia. Lógica pura.
      - name: Probar el GIF de la broma
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/GifBroma.swift Pruebas/GifBroma/main.swift -o /tmp/gif-broma
          /tmp/gif-broma

      # Coro de espera (Juan, 17-nov-2026): tecleo para lo corto y coro pasados 2,5 s, la cuenta de herramientas, el tope, el ducking
      # (Alma −10 dB, Juan −6 dB) y las rampas. Lógica pura.
      - name: Probar el coro de Alma trabajando
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/CoroTrabajoReglas.swift Pruebas/CoroTrabajo/main.swift -o /tmp/coro-trabajo
          /tmp/coro-trabajo

      # Muestras de voz (Hub #781): Claudio pone en la llamada cómo suena una voz. El voice_id, el formato y qué se le contesta.
      - name: Probar las muestras de voz
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/MuestraVoz.swift Pruebas/MuestraVoz/main.swift -o /tmp/muestra-voz
          /tmp/muestra-voz

      # Tarjetas de clubes (Juan, 17-nov-2026): los códigos EAN y Code 39, el formato sugerido, encontrar la que pidió por
      # voz y qué se le contesta a Alma. Lógica pura.
      - name: Probar las tarjetas de clubes
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/TarjetasClubReglas.swift Pruebas/TarjetasClub/main.swift -o /tmp/tarjetas-club
          /tmp/tarjetas-club

      # UNA ROCA (Juan, 16-nov-2026): una sola piedra en toda la app, siempre la misma con distintos tamaños. Solo
      # Alma/RocaAlma.swift la dibuja (ninguna pantalla pinta su propia esfera con degradado) y su pulso respira siempre,
      # crece con la voz (Alma, Claudio o tú) y no se congela con un nivel inválido. Lógica pura.
      - name: Probar una sola roca y su pulso
        if: env.SUBIR != 'true'
        run: |
          if grep -rln "RadialGradient" Alma | grep -v '^Alma/RocaAlma.swift$'; then
            echo "::error::Solo Alma/RocaAlma.swift dibuja la roca. Usa RocaAlma(diametro:) en vez de pintar otra esfera."; exit 1
          fi
          xcrun swiftc Alma/RocaPulso.swift Pruebas/RocaPulso/main.swift -o /tmp/roca-pulso
          /tmp/roca-pulso

      # Modo compañero (Hub #607 T-C1): cuándo se manda al Hub el estado y los subtítulos de la llamada. Lógica pura.
      - name: Probar el modo compañero
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/ColaVivo.swift Pruebas/Companero/main.swift -o /tmp/companero
          /tmp/companero

      # El audio de la llamada (Juan, 17-nov-2026): con el Modo compañero, el micrófono del teléfono de fábrica; lo que elige
      # Juan manda y, si no está conectado, vale lo automático. Lógica pura.
      - name: Probar el audio de la llamada
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/AudioLlamadaReglas.swift Pruebas/AudioLlamada/main.swift -o /tmp/audio-llamada
          /tmp/audio-llamada

      # El encendido del Modo calle (Juan, 6-nov-2026): arranca como lo dejó Juan, apagar apaga de verdad, un aviso con la app
      # abierta no se ve como Modo calle y la voz del aviso es la de Alma. Lógica pura, se prueba sola en segundos.
      - name: Probar el encendido del Modo calle
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/EstadoCalle.swift Pruebas/EstadoCalle/main.swift -o /tmp/estado-calle
          /tmp/estado-calle

      # El inicio de la llamada (6-nov-2026): la ficha con quien_llama sale antes que cualquier cosa de la conversación.
      - name: Probar el inicio de la llamada
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/InicioVoz.swift Pruebas/InicioVoz/main.swift -o /tmp/inicio-voz
          /tmp/inicio-voz

      # Archivos para Alma (Hub, Juan 18-nov-2026): «Compartir» o «Abrir en Alma» deja el archivo cargado en el chat del
      # inicio; solo los tipos que el Hub lee y hasta 8 MB; lo que no sirve se dice. Lógica pura.
      - name: Probar los archivos para Alma
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/ArchivosEntrada.swift Pruebas/ArchivosEntrada/main.swift -o /tmp/archivos-entrada
          /tmp/archivos-entrada

      # Alma abre la conversación (Hub #509 T4): solo con el aviso que el Hub marcó, en Modo calle o conferencia, una vez,
      # con la frase del aviso como primer mensaje y el sueño que cuelga si Juan no contesta. Lógica pura.
      - name: Probar Alma abre
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/AlmaAbre.swift Pruebas/AlmaAbre/main.swift -o /tmp/alma-abre
          /tmp/alma-abre

      # ¿Le contestó el aviso? (Juan, 17-nov-2026): tras una notificación, otra plática o ruido no abren la llamada ni
      # hacen hablar a Alma; sin respuesta del Hub, como antes. Lógica pura.
      - name: Probar la respuesta al aviso
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/RespuestaAviso.swift Pruebas/RespuestaAviso/main.swift -o /tmp/respuesta-aviso
          /tmp/respuesta-aviso

      # Hablar con Claudio (Hub #550): quién cambia a quién, qué se pide al Hub, cuándo se corta la frase de antes y el halo
      # naranja de Claudio. Lógica pura.
      - name: Probar Hablar con Claudio
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/AgenteVoz.swift Pruebas/AgenteVoz/main.swift -o /tmp/agente-voz
          /tmp/agente-voz
      # Claudio local (Hub #629): cuándo terminó de hablar Juan, qué se manda al Hub, qué se dice y qué voz del iPhone imita a
      # Claudio. Lógica pura.
      - name: Probar Claudio local
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/AgenteVoz.swift Alma/ClaudioLocalReglas.swift Pruebas/ClaudioLocal/main.swift -o /tmp/claudio-local
          /tmp/claudio-local
      # Voz de respaldo de Alma (Hub #657): cuándo entra (solo con problemas de conexión), cuándo vuelve a su voz, qué va al
      # Hub y lo que se guarda sin internet. Lógica pura.
      - name: Probar la voz de respaldo
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/RespaldoReglas.swift Pruebas/Respaldo/main.swift -o /tmp/respaldo
          /tmp/respaldo
      # Apple Pay por voz (Hub #662): qué atajo permitido abre la vista de pago y, si no hay, Wallet directo. Lógica pura.
      - name: Probar Apple Pay por voz
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/ApplePayReglas.swift Pruebas/ApplePay/main.swift -o /tmp/apple-pay
          /tmp/apple-pay
      # Maricarmen, el alter ego de Alma (Hub #666): cuándo entra y sale, qué se manda al Hub y su voz. Lógica pura.
      - name: Probar Maricarmen
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/MaricarmenReglas.swift Alma/RespaldoReglas.swift Pruebas/Maricarmen/main.swift -o /tmp/maricarmen
          /tmp/maricarmen
      # La voz local con Kokoro (Juan, 17-nov-2026): los fonemas en español sin espeak (latino y España), números y siglas,
      # el archivo de la voz (.bin / .npy), el catálogo, por frases y cuándo cae a la voz del iPhone. Lógica pura.
      - name: Probar la voz local con Kokoro
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/FonemasES.swift Alma/VozKokoroReglas.swift Pruebas/VozKokoro/main.swift -o /tmp/voz-kokoro
          /tmp/voz-kokoro
      # Poner una voz en la llamada (Hub #779): qué voz pidió Claudio, la lista, la frase de cada voz y lo que se le contesta.
      - name: Probar poner una voz en la llamada
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/FonemasES.swift Alma/VozKokoroReglas.swift Alma/PonerVozReglas.swift Pruebas/PonerVoz/main.swift -o /tmp/poner-voz
          /tmp/poner-voz
      # Notificaciones por tipo (Hub #551): cómo se arma cada una con los ajustes de su tipo (dónde se ve, sonido, urgente,
      # agrupar, vista previa) y Siri solo con la app cerrada o en segundo plano, fuera de conferencia y Modo calle. Lógica pura.
      - name: Probar las notificaciones por tipo
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/AjustesNotif.swift Pruebas/AjustesNotif/main.swift -o /tmp/ajustes-notif
          /tmp/ajustes-notif

      # Notificaciones push reales (Hub, Ticket #28): lo que trae el push, el plan con la app dormida (Siri por tipo, genérica sin
      # vista previa), cómo se ve (igual que las locales), sin duplicados y cuándo la app está lista o avisa que se duerme.
      # Hub #583 T1.3: al tocarla, el id del anillo o del tema (solo ids del Hub) y el JavaScript que abre el chat con ese id.
      - name: Probar las notificaciones push
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/AjustesNotif.swift Alma/NotifPush.swift Pruebas/NotifPush/main.swift -o /tmp/notif-push
          /tmp/notif-push

      # La música mientras Alma habla (Juan, 16-nov-2026): en el Modo calle baja (no se pausa) mientras Alma atiende y en la
      # llamada que abre, y vuelve al esperar sin dejar sordo al micrófono con el teléfono bloqueado. Lógica pura.
      - name: Probar la música del Modo calle
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/AudioCalle.swift Pruebas/AudioCalle/main.swift -o /tmp/audio-calle
          /tmp/audio-calle

      # El anillo que vuelve (Juan, 16-nov-2026): tras una interrupción o un cambio de audífonos vuelve a quedar lista; si no
      # puede, una sola notificación; los pasos van al Hub sin datos personales. Lógica pura.
      # Alma y el anillo (Juan, 16-nov-2026): lo que manda el anillo (batería, pasos, ritmo) con paquetes de ejemplo, lo que
      # dice Alma con su hora, lo que sube al Hub (sin nombre ni dirección del anillo) y los lentes sin batería inventada.
      - name: Probar lo que lee el anillo
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/AnilloDatos.swift Pruebas/AnilloDatos/main.swift -o /tmp/anillo-datos
          /tmp/anillo-datos

      # Wearables (Juan, 17-nov-2026): agregar audífonos sin repetir ni confundirlos con los lentes, la batería sin inventar y
      # lo que va a Ajustes (una tarjeta por wearable). Lógica pura.
      - name: Probar Wearables
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/WearablesReglas.swift Pruebas/Wearables/main.swift -o /tmp/wearables
          /tmp/wearables

      # Modo Creator (Hub #770): la app lo abre a pantalla completa cuando Claudio cambió el diseño. Lógica pura.
      - name: Probar el Modo Creator
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/CreatorReglas.swift Pruebas/Creator/main.swift -o /tmp/creator
          /tmp/creator

      # Saludos grabados (Hub #724): cuándo suena uno al abrir la llamada, cuál (nunca el mismo dos veces), cuándo se piden al
      # Hub y lo que va y viene. Lógica pura.
      - name: Probar los saludos grabados
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/SaludosGrabadosReglas.swift Pruebas/SaludosGrabados/main.swift -o /tmp/saludos-grabados
          /tmp/saludos-grabados

      - name: Probar el anillo que vuelve
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/AnilloVuelve.swift Pruebas/AnilloVuelve/main.swift -o /tmp/anillo-vuelve
          /tmp/anillo-vuelve

      # Conversación continua (Juan, 16-nov-2026: «se corta en automático»): en el Modo calle y en conferencia Alma no cuelga;
      # la app cierra sola tras un silencio, la llamada normal se reabre si su conexión se cae y, si Claudio no conecta,
      # vuelve Alma. Lógica pura.
      - name: Probar la conversación continua
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/LlamadaContinua.swift Alma/SuenoCalle.swift Pruebas/LlamadaContinua/main.swift -o /tmp/llamada-continua
          /tmp/llamada-continua

      # La foto del contacto (Hub #567 T4): solo los números que pide el Hub (máximo 40, sin repetir), coincide por los últimos
      # 8 dígitos y gana el que comparte más (empate: ninguno), recorte cuadrado de 256 px o menos y el permiso. Lógica pura.
      - name: Probar la foto del contacto
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/FotosContactos.swift Pruebas/FotosContactos/main.swift -o /tmp/fotos-contactos
          /tmp/fotos-contactos
      # Diagnóstico del anillo por Bluetooth (ticket #29, paso 1): el nombre de una persona no sale, «solo teclado» se dice
      # claro, los servicios propios se anotan y el registro cabe en el Hub (recorta lo más viejo). Lógica pura.
      - name: Probar el diagnóstico del anillo
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/DiagnosticoAnilloPuro.swift Pruebas/DiagnosticoAnillo/main.swift -o /tmp/diagnostico-anillo
          /tmp/diagnostico-anillo

      # El ritmo de los avisos hablados (Juan, 17-nov-2026, Hub #670): uno a la vez y el más urgente, silencio de 2 min entre
      # uno y otro, y rotan los tres más urgentes recordando el que sigue pendiente (3 veces o 2 h como mucho). Lógica pura.
      - name: Probar el ritmo de los avisos
        if: env.SUBIR != 'true'
        run: |
          xcrun swiftc Alma/RitmoAvisos.swift Pruebas/RitmoAvisos/main.swift -o /tmp/ritmo-avisos
          /tmp/ritmo-avisos

      - name: Generar el proyecto (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilar sin firmar (PR)
        if: env.SUBIR != 'true'
        run: |
          set -o pipefail
          # Si falla, se muestran primero los errores del compilador (con tail solo se veía el final del registro).
          xcodebuild -project Alma.xcodeproj -scheme Alma -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 \
            || { grep -E "error:" -A3 build.log | head -80; tail -20 build.log; exit 1; }
          tail -20 build.log
          # El modelo del Modo calle tiene que ir dentro de la app (carpeta «Calle»): sin él, el detector de «Alma» no carga.
          APP=build/dd/Build/Products/Release-iphoneos/Alma.app
          for n in encoder-epoch-13-avg-2-chunk-16-left-64.int8.onnx decoder-epoch-13-avg-2-chunk-16-left-64.onnx joiner-epoch-13-avg-2-chunk-16-left-64.int8.onnx tokens.txt; do
            test -s "$APP/Calle/$n" || { echo "::error::Alma.app no trae Calle/$n (el modelo del Modo calle)."; exit 1; }
          done
          ls -l "$APP/Calle"
          # Notificaciones push (Ticket #28): la extensión va dentro de la app y el SDK de OneSignal también.
          EXT="$APP/PlugIns/NotifAlma.appex"
          test -x "$EXT/NotifAlma" || { echo "::error::Alma.app no trae PlugIns/NotifAlma.appex (la extensión de las notificaciones push)."; exit 1; }
          [ "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist")" = "com.apple.usernotifications.service" ] \
            || { echo "::error::NotifAlma.appex no es una extensión de notificaciones."; exit 1; }
          test -s "$EXT/alma-foto.png" || { echo "::error::NotifAlma.appex no trae la foto de Alma (alma-foto.png)."; exit 1; }
          test -d "$APP/Frameworks/OneSignalFramework.framework" || { echo "::error::Alma.app no trae OneSignalFramework."; exit 1; }
          # Manifiesto de privacidad (ITMS-91053): sin él Apple manda el correo de «Missing API declaration» en cada subida.
          for m in "$APP/PrivacyInfo.xcprivacy" "$EXT/PrivacyInfo.xcprivacy"; do
            plutil -lint "$m" || { echo "::error::Falta o está mal $m (manifiesto de privacidad)."; exit 1; }
          done
          # El mismo arreglo de la subida (ver abajo), para probarlo en cada PR.
          bash .github/quitar-frameworks-estaticos.sh build/dd/Build/Products/Release-iphoneos/Alma.app

      - name: Llave de App Store Connect
        if: env.SUBIR == 'true'
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          KID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -z "$P8" ] || [ -z "$KID" ]; then echo "::error::Faltan los secretos ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8."; exit 1; fi
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/asc/AuthKey_$KID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_$KID.p8" >> "$GITHUB_ENV"

      - name: Archivar y subir a TestFlight
        if: env.SUBIR == 'true'
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $ASC_KEY_PATH -authenticationKeyID $KID -authenticationKeyIssuerID $ISS"
          # Se archiva sin firmar (la firma de desarrollo pide un iPhone registrado) y la exportación firma para
          # distribución con el certificado que Apple guarda en la nube.
          xcodebuild -project Alma.xcodeproj -scheme Alma -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Alma.xcarchive archive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGNING_ALLOWED=NO | tail -40
          # sherpa-onnx y onnxruntime (Modo calle) son estáticos: su código ya va dentro de Alma, pero Xcode copia sus
          # carpetas a Alma.app/Frameworks y Apple rechaza la subida porque no se pueden firmar («Invalid Signature»).
          bash .github/quitar-frameworks-estaticos.sh build/Alma.xcarchive/Products/Applications/Alma.app
          # El archivo sin firmar no lleva los permisos (Apple Salud): se le ponen con una firma provisional y la
          # exportación los conserva al firmar para distribución (y los activa en el App ID con -allowProvisioningUpdates).
          # Los frameworks de dentro (sherpa-onnx y onnxruntime, dinámicos) también se firman: si van sin firma, la
          # exportación no los vuelve a firmar y Apple rechaza la subida («Invalid Signature»).
          # Apple también exige que el MinimumOSVersion del Info.plist de cada framework sea el mismo con el que se
          # compiló su binario (ITMS-90208 en onnxruntime): se lee el «minos» del binario y se escribe en su Info.plist.
          for f in build/Alma.xcarchive/Products/Applications/Alma.app/Frameworks/*.framework; do
            [ -d "$f" ] || continue
            bin="$f/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$f/Info.plist")"
            minos=$(otool -l "$bin" | awk '/LC_BUILD_VERSION/{b=1} /LC_VERSION_MIN_IPHONEOS/{v=1} b && $1=="minos" && m==""{m=$2} v && $1=="version" && m==""{m=$2} END{print m}')
            if [ -n "$minos" ]; then
              /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion $minos" "$f/Info.plist" 2>/dev/null \
                || /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string $minos" "$f/Info.plist"
              echo "$(basename "$f"): MinimumOSVersion = $minos"
            fi
            codesign --force --sign - "$f"
          done
          # La extensión de las notificaciones push (Ticket #28) se firma antes que la app, con sus permisos (notificación de
          # comunicación): la exportación la firma para distribución con su propio App ID (com.spacioam.alma.notificaciones).
          for x in build/Alma.xcarchive/Products/Applications/Alma.app/PlugIns/*.appex; do
            [ -d "$x" ] || continue
            codesign --force --sign - --entitlements NotifAlma/NotifAlma.entitlements "$x"
          done
          codesign --force --sign - --entitlements Alma/Alma.entitlements build/Alma.xcarchive/Products/Applications/Alma.app
          # Guardia antes de subir (correos de Apple del 3-nov: ITMS-90035 SherpaOnnxC sin firma válida en la 123 e ITMS-90208
          # MinimumOSVersion de onnxruntime en la 130 y la 131). Si algo de eso vuelve, el robot falla aquí en rojo y no sube.
          bash .github/revisar-frameworks.sh build/Alma.xcarchive/Products/Applications/Alma.app
          xcodebuild -exportArchive -archivePath build/Alma.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export $AUTH | tail -60
          echo "Versión 1.0 (${{ github.run_number }}) enviada a TestFlight. Apple la procesa en 5–15 min (el paso «Apple la procesa» espera el resultado)." >> "$GITHUB_STEP_SUMMARY"

      - name: Borrar la llave
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

  # Apple revisa la versión DESPUÉS de subirla y, si la rechaza (ITMS-…), solo avisa por correo: aquí se espera su
  # resultado y el robot queda en rojo si la marca INVALID o si la versión desaparece. En una Mac sale caro esperar,
  # por eso va aparte en Linux.
  procesado:
    needs: app
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Apple la procesa (VALID o INVALID)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          pip install --quiet pyjwt cryptography
          python3 .github/estado-testflight.py --esperar ${{ github.run_number }}
