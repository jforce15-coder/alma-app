# Proyecto de Xcode descrito en texto: el robot lo genera con XcodeGen (`xcodegen generate`) antes de compilar.
# No se guarda el .xcodeproj en el repo.
name: Alma
options:
  bundleIdPrefix: com.spacioam
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: P873UDT96V
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_PREVIEWS: NO
# Modo calle (ModoCalle.swift): el detector de «Alma» en el teléfono. sherpa-onnx (Apache-2.0) por Swift Package, versión
# fija; trae su propio onnxruntime (csukuangfj/onnxruntime-libs 1.28.2) y las sumas de comprobación de sus binarios.
packages:
  SherpaOnnx:
    url: https://github.com/k2-fsa/sherpa-onnx
    exactVersion: 1.13.8
targets:
  Alma:
    type: application
    platform: iOS
    sources:
      - Alma
      # El modelo del detector (~5 MB): el robot lo baja con su suma de comprobación (testflight.yml) y va dentro de la
      # app como la carpeta «Calle». No se guarda en el repo; sin él, el Modo calle avisa que falta.
      - path: Modelos/Calle
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: SherpaOnnx
        product: sherpa-onnx
      # onnxruntime (estático) usa Core ML y la biblioteca de C++.
      - sdk: CoreML.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spacioam.alma
        PRODUCT_NAME: Alma
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: $(inherited) -lc++
    # Apple Salud (solo lectura). El robot de TestFlight le pone estos permisos a la app antes de firmarla.
    entitlements:
      path: Alma/Alma.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Alma/Info.plist
      properties:
        CFBundleDevelopmentRegion: es
        CFBundleDisplayName: Alma
        CFBundleName: Alma
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # Las letras de Alma (Health nativo): Cormorant Garamond y Montserrat, dentro de la app
        UIAppFonts:
          - CormorantGaramond.ttf
          - CormorantGaramond-Italic.ttf
          - Montserrat.ttf
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: Fondo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # «Abrir en Alma»: alma://abrir?u=<enlace> (atajo de Compartir de iOS)
        CFBundleURLTypes:
          - CFBundleURLName: com.spacioam.alma
            CFBundleURLSchemes:
              - alma
        NSMicrophoneUsageDescription: Alma usa el micrófono para hablar contigo por voz y, en el Modo calle, para esperar en tu teléfono a que digas «Alma» (sin grabar ni enviar audio).
        NSSpeechRecognitionUsageDescription: Alma entiende en tu teléfono lo que le pides para escribirlo por ti, despierta en el inicio cuando dices «Alma», en el Modo calle escribe solo lo que le pides después de «Alma» y, en modo conferencia, transcribe la reunión sin enviar audio.
        NSFaceIDUsageDescription: Para entrar a Alma con Face ID, sin escribir tu contraseña.
        NSHealthShareUsageDescription: Alma lee tus pasos, ritmo cardíaco, sueño y ejercicios de Apple Salud para mostrártelos en Health.
        NSHealthUpdateUsageDescription: Alma no escribe en Apple Salud; solo lee lo que tu reloj, tu anillo o tus apps ya guardaron.
        NSBluetoothAlwaysUsageDescription: Alma se conecta a tu anillo para leer tu ritmo cardíaco, pasos y sueño, y para que lo uses para llamarla.
        # El anillo sigue conectado con el teléfono bloqueado.
        UIBackgroundModes:
          - bluetooth-central
          - audio
        NSCameraUsageDescription: Algunas páginas (Epi, Hola) usan la cámara para tomar fotos de los reportes y documentos.
        NSPhotoLibraryUsageDescription: Para subir fotos o documentos a las páginas que lo piden.
        NSLocationWhenInUseUsageDescription: Algunas páginas usan tu ubicación, por ejemplo para las rutas del equipo.
