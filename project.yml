# Proyecto de Xcode descrito en texto: el robot lo genera con XcodeGen (`xcodegen generate`) antes de compilar.
# No se guarda el .xcodeproj en el repo.
name: Alma
options:
  bundleIdPrefix: com.spacioam
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: P873UDT96V
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_PREVIEWS: NO
# Modo calle (ModoCalle.swift): el detector de «Alma» en el teléfono. sherpa-onnx (Apache-2.0) por Swift Package, versión
# fija; trae su propio onnxruntime (csukuangfj/onnxruntime-libs 1.28.2) y las sumas de comprobación de sus binarios.
packages:
  SherpaOnnx:
    url: https://github.com/k2-fsa/sherpa-onnx
    exactVersion: 1.13.8
  # Notificaciones push reales (Hub, Ticket #28): el SDK de OneSignal (MIT modificada), versión fija. Sus frameworks son
  # dinámicos y solo arm64: el robot los firma como los demás (testflight.yml).
  OneSignal:
    url: https://github.com/OneSignal/OneSignal-XCFramework
    exactVersion: 5.8.0
targets:
  Alma:
    type: application
    platform: iOS
    sources:
      - Alma
      # El modelo del detector (~5 MB): el robot lo baja con su suma de comprobación (testflight.yml) y va dentro de la
      # app como la carpeta «Calle». No se guarda en el repo; sin él, el Modo calle avisa que falta.
      - path: Modelos/Calle
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: SherpaOnnx
        product: sherpa-onnx
      # onnxruntime (estático) usa Core ML y la biblioteca de C++.
      - sdk: CoreML.framework
      # Notificaciones push (Ticket #28): el registro en OneSignal (PushAlma.swift) y la extensión que arma cada push
      # como mensaje de Alma (NotifAlma), dentro de la app en PlugIns.
      - package: OneSignal
        product: OneSignalFramework
      - target: NotifAlma
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spacioam.alma
        PRODUCT_NAME: Alma
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: $(inherited) -lc++
    # Apple Salud (solo lectura). El robot de TestFlight le pone estos permisos a la app antes de firmarla.
    # Notificaciones por tipo (Hub #551): de comunicación (Siri las anuncia con su voz) y urgentes (time-sensitive).
    # La exportación las activa en el App ID con -allowProvisioningUpdates, como Apple Salud.
    entitlements:
      path: Alma/Alma.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.usernotifications.communication: true
        com.apple.developer.usernotifications.time-sensitive: true
        # Notificaciones push (Ticket #28). «development» aquí; la exportación para TestFlight la firma como «production».
        aps-environment: development
    info:
      path: Alma/Info.plist
      properties:
        CFBundleDevelopmentRegion: es
        CFBundleDisplayName: Alma
        CFBundleName: Alma
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # Las letras de Alma (Health nativo): Cormorant Garamond y Montserrat, dentro de la app
        UIAppFonts:
          - CormorantGaramond.ttf
          - CormorantGaramond-Italic.ttf
          - Montserrat.ttf
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: Fondo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Siri anuncia las notificaciones de comunicación (Hub #551, NotifArmar.swift): el intent de mensaje que dona la app.
        NSUserActivityTypes:
          - INSendMessageIntent
        # «Abrir en Alma»: alma://abrir?u=<enlace> (atajo de Compartir de iOS)
        CFBundleURLTypes:
          - CFBundleURLName: com.spacioam.alma
            CFBundleURLSchemes:
              - alma
        NSMicrophoneUsageDescription: Alma usa el micrófono para hablar contigo por voz y, en el Modo calle, para esperar en tu teléfono a que digas «Alma» (sin grabar ni enviar audio).
        NSSpeechRecognitionUsageDescription: Alma entiende en tu teléfono lo que le pides para escribirlo por ti, despierta en el inicio cuando dices «Alma», en el Modo calle escribe solo lo que le pides después de «Alma» y, en modo conferencia, transcribe la reunión sin enviar audio.
        NSFaceIDUsageDescription: Para entrar a Alma con Face ID, sin escribir tu contraseña.
        NSHealthShareUsageDescription: Alma lee tus pasos, ritmo cardíaco, sueño y ejercicios de Apple Salud para mostrártelos en Health.
        NSHealthUpdateUsageDescription: Alma no escribe en Apple Salud; solo lee lo que tu reloj, tu anillo o tus apps ya guardaron.
        NSBluetoothAlwaysUsageDescription: Alma se conecta a tu anillo para leer tu ritmo cardíaco, pasos y sueño, para que lo uses para llamarla y, en el diagnóstico, para ver qué manda cuando lo tocas.
        # El anillo sigue conectado con el teléfono bloqueado.
        UIBackgroundModes:
          - bluetooth-central
          - audio
          - remote-notification
        # El número del ícono es de Alma (temas por retomar): OneSignal no lo borra al abrir la app (Ticket #28).
        OneSignal_disable_badge_clearing: true
        NSCameraUsageDescription: Para escanear el código de tus tarjetas de clubes y, en algunas páginas (Epi, Hola), tomar fotos de los reportes y documentos.
        NSPhotoLibraryUsageDescription: Para subir fotos o documentos a las páginas que lo piden.
        # La foto del contacto en la bandeja del Hub (#567 T4, FotosContactosIOS.swift): solo los números sin foto que pide el Hub.
        NSContactsUsageDescription: Alma busca en tus contactos solo los números de las conversaciones de tu bandeja que no tienen foto, para mostrar su foto ahí. No sube tu agenda ni los nombres.
        NSLocationWhenInUseUsageDescription: Algunas páginas usan tu ubicación, por ejemplo para las rutas del equipo.
  # Extensión de notificaciones (Ticket #28): cada push del Hub pasa por aquí antes de verse (con la app cerrada o dormida)
  # y se arma con los ajustes de su tipo; si el tipo tiene Siri, como mensaje de Alma con su foto. Comparte con la app la
  # lógica pura (AjustesNotif, NotifPush) y el mensaje de Alma (NotifComunicacion). No lleva el SDK de OneSignal ni App Group.
  NotifAlma:
    type: app-extension
    platform: iOS
    sources:
      - NotifAlma
      - Alma/AjustesNotif.swift
      - Alma/NotifPush.swift
      - Alma/NotifComunicacion.swift
      - path: Alma/Recursos/Notif/alma-foto.png
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spacioam.alma.notificaciones
        PRODUCT_NAME: NotifAlma
        SKIP_INSTALL: YES
    # Como la app: notificación de comunicación (Siri la anuncia). La exportación la activa en su App ID.
    entitlements:
      path: NotifAlma/NotifAlma.entitlements
      properties:
        com.apple.developer.usernotifications.communication: true
    info:
      path: NotifAlma/Info.plist
      properties:
        CFBundleDevelopmentRegion: es
        CFBundleDisplayName: Alma
        CFBundleName: NotifAlma
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSUserActivityTypes:
          - INSendMessageIntent
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
          NSExtensionAttributes:
            IntentsSupported:
              - INSendMessageIntent
